<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3EE"/>
      <stop offset="1" stop-color="#FFC2D9"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.85" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#CFEAFF"/>
      <stop offset="1" stop-color="#CFEAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FFB8D2"/>
      <stop offset="1" stop-color="#FF7FAE"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- sparkles -->
  <path d="M190 250 L208 312 L270 330 L208 348 L190 410 L172 348 L110 330 L172 312 Z" fill="#FFC93C"/>
  <path d="M842 340 L854 380 L894 392 L854 404 L842 444 L830 404 L790 392 L830 380 Z" fill="#5FB4EC"/>
  <circle cx="860" cy="226" r="16" fill="#FF7FAE"/>
  <circle cx="150" cy="520" r="12" fill="#5FB4EC"/>

  <!-- ears -->
  <path d="M300 372 Q262 210 338 196 Q404 196 452 300 Z" fill="#FF7FAE"/>
  <path d="M724 372 Q762 210 686 196 Q620 196 572 300 Z" fill="#FF7FAE"/>
  <path d="M322 336 Q300 240 344 232 Q384 236 414 300 Z" fill="#FFC2D9"/>
  <path d="M702 336 Q724 240 680 232 Q640 236 610 300 Z" fill="#FFC2D9"/>

  <!-- feet -->
  <rect x="330" y="800" width="120" height="110" rx="46" fill="#F0679C"/>
  <rect x="574" y="800" width="120" height="110" rx="46" fill="#F0679C"/>

  <!-- body/head -->
  <ellipse cx="512" cy="590" rx="352" ry="300" fill="url(#body)"/>
  <ellipse cx="420" cy="440" rx="120" ry="60" fill="#FFFFFF" opacity=".28" transform="rotate(-18 420 440)"/>

  <!-- coin slot -->
  <rect x="430" y="318" width="164" height="30" rx="15" fill="#C93F75"/>

  <!-- coin dropping in -->
  <g transform="rotate(-10 512 210)">
    <circle cx="512" cy="196" r="104" fill="url(#coin)" stroke="#E39A00" stroke-width="14"/>
    <circle cx="512" cy="196" r="70" fill="none" stroke="#FFF1B8" stroke-width="10" opacity=".9"/>
    <path d="M490 150 v92 M490 150 h30 q32 0 32 23 q0 22 -32 22 h-30 M490 195 h34 q34 0 34 24 q0 23 -34 23 h-34 M506 132 v128" fill="none" stroke="#B87400" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- eyes -->
  <ellipse cx="380" cy="540" rx="34" ry="42" fill="#4B3A55"/>
  <ellipse cx="644" cy="540" rx="34" ry="42" fill="#4B3A55"/>
  <circle cx="392" cy="524" r="12" fill="#FFFFFF"/>
  <circle cx="656" cy="524" r="12" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="300" cy="640" rx="54" ry="32" fill="#FF5C97" opacity=".45"/>
  <ellipse cx="724" cy="640" rx="54" ry="32" fill="#FF5C97" opacity=".45"/>

  <!-- snout -->
  <ellipse cx="512" cy="660" rx="122" ry="88" fill="#FF6FA3"/>
  <ellipse cx="512" cy="652" rx="110" ry="76" fill="#FF8DB7"/>
  <ellipse cx="470" cy="656" rx="20" ry="32" fill="#B8326A"/>
  <ellipse cx="554" cy="656" rx="20" ry="32" fill="#B8326A"/>

  <!-- smile -->
  <path d="M470 770 q42 30 84 0" fill="none" stroke="#B8326A" stroke-width="14" stroke-linecap="round"/>
</svg>
